# ============================================================
# Nginx config snippet for TestwallBooker
# Add this inside the existing  server { ... }  block on c-l-twc-001
# File: /etc/nginx/sites-available/default  (or wherever the server block lives)
# ============================================================

    # ── Static front-end ────────────────────────────────────────
    location /booking/ {
        alias /usr/share/nginx/html/booking/;
        try_files $uri $uri/ /booking/index.html;
    }

    # ── Backend API (proxy to Node.js) ──────────────────────────
    # Strip the /booking prefix so the Node server receives /api/...
    location /booking/api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
